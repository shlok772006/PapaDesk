name: papadesk
description: "Smart Business Manager for a small electronics-accessories retail/wholesale business."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase — architecture.md §6
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4
  firebase_crashlytics: ^5.2.4

  # State management — architecture.md §6
  flutter_riverpod: ^3.3.2

  # Formatting — architecture.md §6
  intl: ^0.20.3
  image_picker: ^1.2.3
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^10.1.0
  file_picker: ^8.1.5
  path_provider: ^2.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
